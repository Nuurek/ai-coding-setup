name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          shellcheck --severity=warning
          .githooks/pre-commit setup bin/*.sh coder/scripts/*.sh
          features/bundle.sh features/src/tooling/install.sh features/src/tooling/ai-coding-setup-init

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coder
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
